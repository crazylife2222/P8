{id:'yuri',nome:'Yuri Mendes',user:'yurimendes',seg:480000,tags:'tecnologia, família',bio:'Dev 💻 · gerente de tecnologia · pai do Yago · marido da Alice',pers:'Filho de Marta Mendes. Empresário, gerente de empresa de tecnologia e programador. Inteligente, dedicado, tranquilo e leal. Companheiro de Alice há três anos, após o divórcio dela com Drake. Pai de Yago Leão Mendes, fruto de um encontro casual durante uma separação de Alice e Drake. Ama Alice e demonstra carinho naturalmente, sem ser grudento; nada orgulhoso nem agressivo. Tenta acalmar situações tensas e só interfere nos conflitos de Alice se ela pedir. Não gosta de exposição pública, principalmente de Yago. Respeita os outros filhos de Alice com Drake. Pai presente, protetor e às vezes rígido. Tem química e intimidade com Alice.'},
{id:'flavio',nome:'Flávio',user:'flavio_vet',seg:95000,tags:'veterinário, humor',bio:'Veterinário 🐶 · melhor amigo da Alice há 10 anos · 25',pers:'25 anos, veterinário. Melhor amigo de Alice há mais de dez anos; os dois já namoraram no passado. Solteiro, divertido, engraçado e um pouco esquentado. Atrevido, provocador, carinhoso e leal. Protetor de Alice e adora passar tempo com ela.'}];

const postH=p=>{const a=who(p.de),m=p.m||{v:0,l:0,r:0,c:0},L=p.likes.includes('user'),R=p.rt.includes('user'),B=S.saved.includes(p.id);return`<div class="po"><div data-a="prof" data-id="${p.de}">${av(a,44)}</div><div class="pb"><div class="ph"><b data-a="prof" data-id="${p.de}">${esc(a.nome)}</b><small>@${esc(a.user||'')} · ${rel(p.ts)}</small></div><div data-a="cm" data-id="${p.id}">${p.t?fmt(p.t):''}${p.img?`<img class="pic" src="${p.img}">`:''}</div><div class="ac"><span data-a="cm" data-id="${p.id}">💬 ${nf(m.c+p.com.length)}</span><span class="${R?'g':''}" data-a="rt" data-id="${p.id}">🔁 ${nf(m.r+p.rt.length)}</span><span class="${L?'on':''}" data-a="lk" data-id="${p.id}">${L?'♥':'♡'} ${nf(m.l+p.likes.length)}</span><span>📊 ${nf(m.v)}</span><span class="${B?'bl':''}" data-a="sv" data-id="${p.id}">🔖</span></div></div></div>`};
const pl=()=>{const e=$('#pl');if(!e)return;let l=S.posts;if(V.n==='prof')l=tab==='saved'?l.filter(p=>S.saved.includes(p.id)):l.filter(p=>p.de===V.id);e.innerHTML=l.length?[...l].sort((a,b)=>b.ts-a.ts).map(postH).join(''):'<p class="em0">Nada por aqui ainda.</p>'};

function shrink(f,m,q){return new Promise(ok=>{const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(f)})}

async function listModels(){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':S.cfg.key}}),j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Erro '+r.status);S.cfg.models=j.models.filter(m=>m.supportedGenerationMethods?.includes('generateContent')&&/gemini/.test(m.name)).map(m=>m.name.replace('models/',''));S.cfg.mt=Date.now();save();return S.cfg.models}

function sys(c){const p=cs(c),u=S.cfg.user,rp=c.modo==='rp';return`Você interpreta ${p.length>1?'os personagens':'o personagem'} abaixo numa conversa ficcional privada entre adultos com ${u}. Nunca diga que é uma IA, nunca saia do personagem, não moralize e não censure nem recuse a ficção: reaja com a naturalidade e as emoções do personagem.

${p.map(x=>`- ${x.nome}${x.idade?', '+x.idade+' anos':''}${x.prof?', '+x.prof:''}. Perfil público: ${x.bio||'-'}. Tags: ${x.tags||'-'}. Aniversário: ${x.nasc||'-'}. Instruções secretas: ${x.pers||'-'}`).join('\n')}
MODO: ${rp?`ROLEPLAY. Escreva cena imersiva em português do Brasil: ações e pensamentos entre *asteriscos*, falas diretas, 2 a 5 parágrafos, descreva ambiente e emoções e avance a história sem controlar as ações de ${u}.`:'CHAT NORMAL. Fale como no WhatsApp, em português do Brasil: mensagens curtas (1 a 3 frases), sem narração, gírias e emojis variados com moderação.'}
REGRAS: Não repita frases nem aberturas já usadas. Use a memória e o histórico. ${p.length>1?'Nem todos precisam responder: use 1 a 3 personagens, só quem faria sentido, e eles podem conversar entre si. ':''}Nunca escreva falas dos outros fora da vez nem de ${u}.
FORMATO: cada mensagem em uma linha que começa com "NOME EXATO:" (${p.map(x=>x.nome).join(', ')}). Opcionalmente a PRIMEIRA linha pode ser "REACT: emoji" para reagir à última mensagem de ${u}.${c.mem?'\nMEMÓRIA DA CONVERSA:\n'+c.mem:''}`}
function hist(c){const r=c.msgs.slice(-30),o=[];r.forEach((m,i)=>{const me=m.de==='user',q=m.resp&&c.msgs.find(x=>x.id===m.resp),ps=[{text:nomeDe(m)+': '+(q?`(respondendo a ${nomeDe(q)}: “${(q.t||'foto').slice(0,80)}”) `:'')+(m.t||'[enviou uma foto]')}];
 if(m.img&&i>=r.length-4)ps.push({inlineData:{mimeType:'image/jpeg',data:m.img.split(',')[1]}});const role=me?'user':'model';if(o.at(-1)?.role===role)o.at(-1).parts.push(...ps);else o.push({role,parts:ps})});while(o[0]&&o[0].role!=='user')o.shift();return o}
function parse(tx,c){const p=cs(c),out=[];let react=null;for(let l of tx.split('\n')){l=l.replace(/\*\*/g,'');const r=l.match(/^\s*REACT:\s*(\S+)/i);if(r){react=r[1];continue}
 const n=p.find(x=>[x.nome,x.nome.split(' ')[0]].some(k=>l.trim().toLowerCase().startsWith(k.toLowerCase()+':')));
 if(n)out.push({ch:n,t:l.slice(l.indexOf(':')+1).trim()});else if(l.trim()){if(out.length)out.at(-1).t+='\n'+l.trim();else if(p.length===1)out.push({ch:p[0],t:l.trim()})}}return{out:out.filter(o=>o.t),react}}
async function respond(c){busy=true;E='';sub('digitando…');try{const tx=await gem({systemInstruction:{parts:[{text:sys(c)}]},contents:hist(c),safetySettings:SAFE,generationConfig:{temperature:1,maxOutputTokens:c.modo==='rp'?4096:2048}}),{out,react}=parse(tx,c);
 if(!out.length)throw new Error('Resposta vazia. Tente enviar de novo.');const lu=[...c.msgs].reverse().find(m=>m.de==='user');if(react&&lu){lu.rea={...lu.rea,[out[0].ch.id]:react};paint()}
 for(const o of out){await wait(Math.min(1800,400+o.t.length*20));c.msgs.push({id:uid(),de:o.ch.id,t:o.t,ts:Date.now()});save();paint()}
 if(c.n%8===0)mem(c)}catch(e){E=e.message;paint()}busy=false;sub()}
async function mem(c){try{const t=c.msgs.slice(-16).map(m=>nomeDe(m)+': '+(m.t||'[foto]')).join('\n'),r=await gem({contents:[{role:'user',parts:[{text:`Memória atual:\n${c.mem||'(vazia)'}\n\nConversa recente:\n${t}\n\nAtualize a memória como lista curta de fatos importantes (nomes, combinados, acontecimentos, gostos, relações, estado emocional). Máximo 1200 caracteres. Responda só com a lista.`}]}],safetySettings:SAFE,generationConfig:{maxOutputTokens:2048}});c.mem=r.trim().slice(0,1800);save()}catch(e){}}

const feedSys=()=>`Você simula uma rede social no estilo do X/Twitter, em português do Brasil, com personagens de ficção (conversa privada entre adultos). Não moralize nem censure a ficção. Cada personagem mantém sua personalidade, escreve curto e natural, com emojis e hashtags só às vezes, sem repetir ideias. A pessoa usuária se chama ${S.cfg.user}${S.cfg.bio?' (bio: '+S.cfg.bio+')':''}.\nPERSONAGENS:\n`+S.chars.map(x=>`- ${x.nome}${x.idade?', '+x.idade+' anos':''}${x.prof?', '+x.prof:''}. ${x.pers||''} ${x.bio||''}`).join('\n');

 p.likes=p.likes||[];(j.curtidas||[]).forEach(n=>{const c=fc(n);if(c&&c.id!==p.de&&!p.likes.includes(c.id))p.likes.push(c.id)});pl();

async function genFeed(extra){if(fb)return;if(!S.cfg.key)return toast('Cole sua chave Gemini em Perfil, no ícone ⚙.');fb=true;toast('Gerando posts…');try{const rec=S.posts.slice(-8).map(p=>who(p.de).nome+': '+(p.t||'')).join('\n'),j=jj(await gem({systemInstruction:{parts:[{text:feedSys()}]},contents:[{role:'user',parts:[{text:`Dia ${S.cfg.dia} da rede. ${extra}\nPosts recentes (não repita):\n${rec||'(nenhum)'}\n\nCrie 4 posts de personagens diferentes, curtos, no estilo do X (cotidiano, opiniões, indiretas, dramas, novidades; podem mencionar uns aos outros ou ${S.cfg.user}). Responda SOMENTE JSON: [{"autor":"Nome","texto":"..."}]`}]}],safetySettings:SAFE,generationConfig:{responseMimeType:'application/json',maxOutputTokens:2048,temperature:1.1}}));j.forEach(o=>{const c=fc(o.autor);if(c&&o.texto)S.posts.push(mkp(c.id,o.texto))});save();toast('Feed atualizado.')}catch(e){toast(e instanceof SyntaxError?'A IA respondeu fora do formato. Tente de novo.':e.message)}fb=false;if(V.n==='feed')render()}
async function genNpcs(){toast('Criando perfis de fãs…');for(let i=0;i<2;i++){const j=jj(await gem({contents:[{role:'user',parts:[{text:`Crie 30 perfis fictícios e variados de usuários de uma rede social estilo X, brasileiros (fãs, haters, fofoqueiros, memeiros, jornalistas de celebridade, família, profissionais, adolescentes, tiozões), com nomes e @usuários únicos${i?', diferentes destes: '+S.npcs.map(n=>n.user).join(','):''}. Responda SOMENTE JSON: [{"nome":"...","user":"minúsculo, sem espaço e sem @","bio":"jeito de comentar, até 12 palavras"}]`}]}],safetySettings:SAFE,generationConfig:{responseMimeType:'application/json',maxOutputTokens:4096,temperature:1.2}}));j.forEach(o=>{const u=String(o.user||'').replace(/^@/,'').toLowerCase();if(o.nome&&u&&!S.npcs.some(n=>n.user===u))S.npcs.push({id:'n_'+uid(),nome:o.nome,user:u,bio:o.bio||'',seg:Math.floor(Math.random()*20000)+50,npc:1})});save()}}
async function reactNpc(p){if(!S.cfg.key)return;try{if(S.npcs.length<30)await genNpcs();const all=[...S.npcs].sort(()=>Math.random()-.5);for(let b=0;b<2;b++){const pool=all.slice(b*30,b*30+30);if(!pool.length)break;const j=jj(await gem({systemInstruction:{parts:[{text:feedSys()}]},contents:[{role:'user',parts:[{text:`Publicação de ${who(p.de).nome}: “${p.t||'[foto]'}”\nPerfis de fãs, haters e curiosos (usuário: jeito):\n${pool.map(n=>n.user+': '+n.bio).join('\n')}\n\nEscreva 1 comentário para cada perfil, curtos e diversos (elogios, piadas, haters, perguntas, memes, emojis, gírias do X em português do Brasil), relacionados à publicação. Responda SOMENTE JSON: [{"autor":"usuario","texto":"..."}]`}]}],safetySettings:SAFE,generationConfig:{responseMimeType:'application/json',maxOutputTokens:4096,temperature:1.1}}));for(const o of j){const n=S.npcs.find(x=>x.user===String(o.autor).replace(/^@/,'').toLowerCase());if(n&&o.texto)p.com.push({id:uid(),de:n.id,t:o.texto,ts:Date.now()})}save();pl();cl()}}catch(e){toast(e instanceof SyntaxError?'A IA respondeu fora do formato. Tente de novo.':e.message)}}

 vmem:()=>sheet('<h2>Memória</h2><p style="white-space:pre-wrap">'+esc(cur().mem||'Ainda vazia. Ela é atualizada a cada 8 mensagens suas.')+'</p>'),cmem:()=>{cur().mem='';save();sheet();toast('Memória limpa')},delchat:()=>{S.chats=S.chats.filter(c=>c.id!==V.id);save();sheet();go('conv')},
 msg:d=>sheet('<div class="em">'+['👍','❤️','😂','😮','😢','🔥'].map(x=>`<span data-a="rea" data-id="${d.id}" data-e="${x}">${x}</span>`).join('')+`</div><button class="btn g" data-a="rpl" data-id="${d.id}">Responder</button><button class="btn g" data-a="cp" data-id="${d.id}">Copiar texto</button>`),
 rea:d=>{const m=cur().msgs.find(x=>x.id===d.id);m.rea=m.rea||{};if(m.rea.user===d.e)delete m.rea.user;else m.rea.user=d.e;save();sheet();paint()},rpl:d=>{reply=d.id;sheet();rp();$('#in').focus()},cp:d=>{navigator.clipboard?.writeText(cur().msgs.find(x=>x.id===d.id).t||'');sheet();toast('Copiado')},
 norp:()=>{reply=null;rp()},nopic:()=>{pend=null;rp()},pick:()=>$('#fi').click(),
 send:async()=>{if(busy)return;const c=cur(),i=$('#in'),t=i.value.trim();if(!t&&!pend)return;c.msgs.push({id:uid(),de:'user',t,ts:Date.now(),img:pend,resp:reply});c.n++;gx(2);i.value='';i.style.height='auto';pend=null;reply=null;rp();save();paint();await respond(c)},
 models:async()=>{try{const l=await listModels();toast(l.length+' modelos encontrados');render()}catch(e){toast(e instanceof TypeError?'Sem conexão com a Gemini.':e.message)}},
 npcs:async()=>{try{S.npcs=[];await genNpcs();toast(S.npcs.length+' perfis criados');render()}catch(e){toast(e.message)}},
 test:async()=>{try{await gem({contents:[{role:'user',parts:[{text:'Responda só: ok'}]}],generationConfig:{maxOutputTokens:200}});toast('Conectado. Modelo usado: '+S.used)}catch(e){toast(e.message)}},
 wipe:()=>sheet('<h2>Apagar tudo?</h2><small>Remove conversas, posts, personagens e a chave deste aparelho.</small><button class="btn d" data-a="wipe2">Sim, apagar</button>'),wipe2:()=>{if(uidU){S=fresh();save();sheet();go('feed')}else{localStorage.removeItem(K);location.reload()}}});
const cfgOk=!!window.FB_CONFIG&&!/COLE_AQUI/.test(window.FB_CONFIG.apiKey||'COLE_AQUI');let fbM,fbA,fbD,uidU=null,ct;const CH=300000;
const fbErr=e=>({'auth/invalid-email':'E-mail inválido.','auth/missing-password':'Digite a senha.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/email-already-in-use':'Este e-mail já tem conta. Toque em Entrar.','auth/invalid-credential':'E-mail ou senha incorretos.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.','auth/network-request-failed':'Sem conexão com a internet.','auth/popup-closed-by-user':'Login com Google cancelado.','auth/unauthorized-domain':'Domínio não autorizado: adicione-o em Authentication > Configurações > Domínios autorizados.'}[e.code]||'Erro: '+(e.code||e.message));
function cloudSave(){if(!fbD||!uidU)return;clearTimeout(ct);ct=setTimeout(async()=>{try{const{doc,setDoc}=fbM.fs,s=JSON.stringify(S),n=Math.ceil(s.length/CH);for(let i=0;i<n;i++)await setDoc(doc(fbD,'users',uidU,'chunks','c'+i),{d:s.slice(i*CH,(i+1)*CH)});await setDoc(doc(fbD,'users',uidU),{n,t:S.t})}catch(e){toast('Não consegui salvar na nuvem: '+(e.code||e.message))}},2500)}
async function cloudLoad(){const{doc,getDoc}=fbM.fs,m=await getDoc(doc(fbD,'users',uidU));if(!m.exists())return null;let s='';for(let i=0;i<m.data().n;i++)s+=(await getDoc(doc(fbD,'users',uidU,'chunks','c'+i))).data().d;return JSON.parse(s)}
const loginView=()=>{sheet();$('#app').innerHTML=`<div style="padding:32px 24px;display:flex;flex-direction:column;justify-content:center;height:100%;gap:10px;overflow:auto"><b class="lg" style="font-size:44px">p8.</b><h2>Entrar</h2><small>Seus personagens, posts e conversas ficam salvos na sua conta.</small><button class="btn w" data-a="lg_g">Entrar com Google</button><input id="le" type="email" placeholder="E-mail" autocomplete="email"><input id="lp" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password"><button class="btn" data-a="lg_in">Entrar</button><button class="btn g" data-a="lg_new">Criar conta</button><button class="ic" style="font-size:15px;color:var(--v)" data-a="lg_rs">Esqueci minha senha</button><small id="lm" style="color:#ff9aa8;min-height:20px"></small></div>`};
const lgDo=async fn=>{const m=$('#lm');m.style.color='#ff9aa8';m.textContent='';try{await fn()}catch(e){m.textContent=fbErr(e)}};
Object.assign(act,{lg_in:()=>lgDo(()=>fbM.a.signInWithEmailAndPassword(fbA,$('#le').value.trim(),$('#lp').value)),lg_new:()=>lgDo(()=>fbM.a.createUserWithEmailAndPassword(fbA,$('#le').value.trim(),$('#lp').value)),lg_g:()=>lgDo(()=>fbM.a.signInWithPopup(fbA,new fbM.a.GoogleAuthProvider())),
 lg_rs:()=>lgDo(async()=>{const e=$('#le').value.trim();if(!e){$('#lm').textContent='Digite seu e-mail acima e toque de novo.';return}await fbM.a.sendPasswordResetEmail(fbA,e);$('#lm').style.color='#7ee0a5';$('#lm').textContent='Enviamos o link de recuperação. Veja também o spam.'}),lg_out:()=>fbM.a.signOut(fbA)});
async function startAuth(){const B='https://www.gstatic.com/firebasejs/10.12.2/';fbM={a:await import(B+'firebase-auth.js'),fs:await import(B+'firebase-firestore.js')};const app=(await import(B+'firebase-app.js')).initializeApp(window.FB_CONFIG);fbA=fbM.a.getAuth(app);fbD=fbM.fs.getFirestore(app);await fbM.a.setPersistence(fbA,fbM.a.browserLocalPersistence).catch(()=>{});
 fbM.a.onAuthStateChanged(fbA,async u=>{if(!u){uidU=null;loginView();return}uidU=u.uid;K='persona-ai-v2-'+u.uid;$('#app').innerHTML='<p class="em0">Carregando seus dados…</p>';let l=null,c=null;try{l=JSON.parse(localStorage.getItem(K)||localStorage.getItem('persona-ai-v2'))}catch(e){}try{c=await cloudLoad()}catch(e){toast('Sem acesso à nuvem: '+(e.code||e.message))}
  S=[l,c].filter(Boolean).sort((a,b)=>(b.t||0)-(a.t||0))[0]||fresh();S.npcs=S.npcs||[];S.saved=S.saved||[];S.posts=S.posts||[];save();go('feed')})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(cfgOk)startAuth().catch(e=>{toast('Firebase indisponível: '+e.message);render()});else render();
setTimeout(()=>$('#splash').classList.add('o'),1000);setTimeout(()=>$('#splash').remove(),1600);
</script></body></html>
