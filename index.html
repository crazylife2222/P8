function sys(c){const p=cs(c),u=S.cfg.user,rp=c.modo==='rp';return`Você interpreta ${p.length>1?'os personagens':'o personagem'} abaixo numa conversa ficcional privada entre adultos com ${u}. Nunca diga que é uma IA, nunca saia do personagem, não moralize e não censure nem recuse a ficção: reaja com a naturalidade e as emoções do personagem.
PERSONAGENS:
${p.map(x=>`- ${x.nome}${x.idade?', '+x.idade+' anos':''}${x.prof?', '+x.prof:''}. Perfil público: ${x.bio||'-'}. Relação com ${u} (tags): ${x.tags||'-'}. Aniversário: ${x.nasc||'-'}. Instruções secretas: ${x.pers||'-'}. Humor atual: ${x.hum?x.hum.v+'/100 ('+x.hum.txt+'), deixe isso influenciar seu comportamento':'neutro'}`).join('\n')}
MODO: ${rp?`ROLEPLAY. Escreva cena imersiva em português do Brasil: ações e pensamentos entre *asteriscos*, falas SEMPRE entre aspas duplas, 2 a 5 parágrafos, descreva ambiente e emoções e avance a história sem controlar as ações de ${u}.`:'CHAT NORMAL. Fale como no WhatsApp, em português do Brasil: mensagens curtas (1 a 3 frases), sem narração, gírias e emojis variados com moderação.'}\nREGRAS: Não repita frases nem aberturas já usadas. Use a memória e o histórico. Nunca escreva falas ou ações de ${u}.${p.length>1?' CENA DE RPG (não é um grupo de chat): quem participa é quem foi marcado com @ ou citado pelo nome na última mensagem e quem está presente na cena pelo contexto. TODOS os personagens presentes e envolvidos no assunto devem reagir, cada um no seu balão, na ordem em que faria sentido, e podem interagir entre si; pode ser 1 ou todos, conforme o caminhar da história. Quem não está na cena ou não tem a ver com o assunto NÃO responde: não escreva nada por ele e não aja como se estivessem num grupo de mensagens.':''}${mentionsLine(c)}\nRELAÇÕES: as tags de cada personagem dizem o que ele é PARA ${u} (a pessoa principal), nunca para os outros personagens. A relação entre dois personagens vem do roteiro e dos perfis (quem é sogra de ${u} é mãe do marido dela, por exemplo). Não troque nem invente parentescos.\nFORMATO DA RESPOSTA (obrigatório): cada personagem que fala começa a própria mensagem com o nome dele e dois-pontos, por exemplo "${p[0]?p[0].nome:'Nome'}: texto". Nomes válidos: ${p.map(x=>x.nome).join(', ')}. Nunca escreva as palavras NOME EXATO. Um personagem por balão; nunca misture falas ou ações de dois personagens na mesma mensagem. Se quiser, a primeira linha pode ser "REACT: emoji" (só o emoji) para reagir à última mensagem de ${u}. Depois de todas as mensagens, escreva uma linha por personagem que falou, no formato "HUMOR ${p[0]?p[0].nome:'Nome'}: 75 | sentimento curto" (número de 0 a 100, sem "/100"), refletindo como ele se sente agora.${c.mem?'\n function hist(c){const r=c.msgs.slice(-30),o=[];r.forEach((m,i)=>{const me=m.de==='user',q=m.resp&&c.msgs.find(x=>x.id===m.resp),ps=[{text:nomeDe(m)+': '+(q?`(respondendo a ${nomeDe(q)}: “${(q.t||'foto').slice(0,80)}”) `:'')+(m.t||'[enviou uma foto]')}];

function parse(tx,c){const p=cs(c),out=[],E_=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),nm=x=>[x.nome,x.nome.split(' ')[0]].map(E_).join('|');let react=null,reactBy=null;
 tx=tx.normalize('NFC').replace(/\u00a0/g,' ').replace(/\*\*/g,'').replace(/NOME\s+EXATO\s*:?/gi,'');
 tx=tx.split('\n').map(L=>/^[\s*_]*(HUMOR|REACT)/i.test(L)?L:p.reduce((s,x)=>s.replace(new RegExp('(\\S)[ \\t]+(?=[*_]*'+E_(x.nome)+'[*_]*[ \\t]*:)','gi'),'$1\n'),L)).join('\n');
 const rx=p.map(x=>({x,r:new RegExp('^([\\s*_>\\-–•"“]*)(?:'+nm(x)+')[\\s*_]*(?:\\([^)]*\\))?[\\s*_]*:','i'),b:new RegExp('^[\\s*_>\\-–•"“]*(?:'+nm(x)+')[\\s*_]*$','i')}));
 for(const l0 of tx.split('\n')){const hm=l0.match(/^[\s*_]*HUMOR\s+(.+?):\s*(\d{1,3})(?:\s*\/\s*100)?\s*[|\-–:]?\s*(.*)$/i);if(hm){const n=fc(hm[1].replace(/[*_]/g,''));if(n)n.hum={v:Math.min(100,+hm[2]),txt:(hm[3]||'').trim().slice(0,40)||'—'};continue}
  let l=l0,w=null;for(const q of rx){const m=l.match(q.r);if(m){w=q.x;l=l.slice(m[0].length);if(/[*_]/.test(m[1]))l=l.replace(/^[*_]+/,'');l=l.replace(/^[ \t]+/,'');break}}
  if(!w){const bq=rx.find(q=>q.b.test(l));if(bq){out.push({ch:bq.x,t:''});continue}}
  const r=l.match(/^[\s*_]*REACT[\s*_]*:?[\s*_]*(\S{1,8})\s*$/i);if(r){react=r[1];reactBy=w||reactBy;continue}
  if(w)out.push({ch:w,t:l});else if(l.trim()){if(out.length)out.at(-1).t+='\n'+l;else if(p.length===1)out.push({ch:p[0],t:l})}}
 return{out:out.map(o=>({...o,t:o.t.trim()})).filter(o=>o.t),react,reactBy}}

async function genNpcs(){toast('Criando perfis de fãs…');for(let i=0;i<2;i++){const j=jj(await gem({contents:[{role:'user',parts:[{text:`Crie 30 perfis fictícios e variados de usuários de uma rede social estilo X, brasileiros (fãs, haters, fofoqueiros, memeiros, jornalistas de celebridade, família, profissionais, adolescentes, tiozões), com nomes e @usuários únicos${i?', diferentes destes: '+S.npcs.map(n=>n.user).join(','):''}. Responda SOMENTE JSON: [{"nome":"...","user":"minúsculo, sem espaço e sem @","bio":"jeito de comentar, até 12 palavras"}]`}]}],safetySettings:SAFE,generationConfig:{responseMimeType:'application/json',maxOutputTokens:4096,temperature:1.2}}));j.forEach(o=>{const u=String(o.user||'').replace(/^@/,'').toLowerCase();if(o.nome&&u&&!S.npcs.some(n=>n.user===u))S.npcs.push({id:'n_'+uid(),nome:o.nome,user:u,bio:o.bio||'',seg:Math.floor(Math.random()*20000)+50,npc:1})});save()}}
async function reactNpc(p){if(!S.cfg.key)return;try{if(S.npcs.length<30)await genNpcs();const all=[...S.npcs].sort(()=>Math.random()-.5);for(let b=0;b<2;b++){const pool=all.slice(b*30,b*30+30);if(!pool.length)break;const j=jj(await gem({systemInstruction:{parts:[{text:feedSys()}]},contents:[{role:'user',parts:[{text:`Publicação de ${who(p.de).nome}: “${pt(p)}”\nComentários já escritos (não repita ideias nem frases): ${p.com.slice(-20).map(c=>c.t).join(' | ')||'(nenhum)'}\nPerfis de fãs, haters e curiosos (usuário: jeito):\n${pool.map(n=>n.user+': '+n.bio).join('\n')}\n\nEscreva 1 comentário para cada perfil, curtos e diversos (elogios, piadas, haters, perguntas, memes, emojis, gírias do X em português do Brasil), relacionados à publicação. Responda SOMENTE JSON: [{"autor":"usuario","texto":"..."}]`}]}],safetySettings:SAFE,generationConfig:{responseMimeType:'application/json',maxOutputTokens:4096,temperature:1.1}}));addCom(p,j);save();pl();cl()}}catch(e){toast(e instanceof SyntaxError?'A IA respondeu fora do formato. Tente de novo.':e.message)}}
